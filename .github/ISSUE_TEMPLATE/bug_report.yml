name: Bug report
description: Report reproducible incorrect behavior using sanitized data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include real credentials or customer source. Report vulnerabilities privately.
  - type: input
    id: version
    attributes:
      label: FDEKit version, Python version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command and minimal reproduction
      description: Use synthetic files and redact sensitive paths.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
