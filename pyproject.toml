[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fdekit"
version = "0.1.0"
description = "Local-first deployment-readiness evidence for Forward Deployed Engineers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "FDEKit contributors"}]
dependencies = ["typer>=0.16,<1", "rich>=13.9,<15", "pydantic>=2.10,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "build>=1.2,<2"]

[project.scripts]
fdekit = "fdekit.cli.app:app"

[project.urls]
Repository = "https://github.com/PRABHMANNAT/FDEKit-Open-Source-Forward-Deployed-Engineering-Toolkit"

[tool.hatch.build.targets.wheel]
packages = ["src/fdekit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/fdekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=fdekit --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true

